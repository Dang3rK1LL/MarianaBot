name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,discord]"
      - run: python -m ruff check src scripts
      - run: python -m ruff format --check src scripts
      - run: python -m compileall -q src scripts
      - run: python -c "from marianabot.cli import app; from marianabot.guidance import Intake, Questions; from marianabot.discord_bot import ResearchCommands"
